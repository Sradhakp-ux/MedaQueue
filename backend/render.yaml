services:
  - type: web
    name: medaqueue-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: DJANGO_DB_ENGINE
        value: django.db.backends.postgresql
      - key: DJANGO_DB_NAME
        value: medaqueue
      - key: DJANGO_DB_USER
        value: medaqueue
      - key: DJANGO_DB_PASSWORD
        generateValue: true
      - key: DJANGO_DB_HOST
        fromDatabase:
          name: medaqueue-db
          property: host
      - key: DJANGO_DB_PORT
        fromDatabase:
          name: medaqueue-db
          property: port
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_LOG_LEVEL
        value: INFO
    disks:
      - name: media
        mountPath: /opt/render/project/src/media
        sizeGB: 1

databases:
  - name: medaqueue-db
    plan: free
    databaseName: medaqueue
    user: medaqueue
